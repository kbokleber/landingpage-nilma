<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post | Dra. Nilma Alves</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <style>
    :root {
      --wine: #7f4258;
      --wine-dark: #70354c;
      --bg: #efefef;
      --ink: #222;
      --muted: #666;
      --line: #e3e3e3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', Arial, sans-serif;
      background: #fff;
      color: var(--ink);
      line-height: 1.6;
      font-weight: 300;
    }
    a { color: var(--wine-dark); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .top { background: #fff; border-bottom: 1px solid var(--line); }
    .top .container { width: min(1140px, 93%); margin: 0 auto; padding: 18px 0; }
    .menu { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .menu a {
      background: var(--wine-dark);
      color: #fff;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 13px;
      letter-spacing: 0.4px;
      font-weight: 500;
      line-height: 1;
    }
    .menu a:hover { filter: brightness(1.08); text-decoration: none; }

    .post-hero {
      background: var(--bg);
      padding: 50px 0 40px;
    }
    .post-hero .container { width: min(820px, 93%); margin: 0 auto; }
    .post-back {
      display: inline-block;
      font-size: 12px;
      color: var(--wine-dark);
      font-weight: 500;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .post-title {
      font-size: 40px;
      font-weight: 600;
      line-height: 1.2;
      color: var(--ink);
      margin-bottom: 14px;
    }
    .post-meta {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }
    .post-meta strong { color: var(--ink); font-weight: 500; }

    .post-cover {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      aspect-ratio: 16 / 9;
      background: #ededed center/cover no-repeat;
    }

    .post-body {
      padding: 50px 0 70px;
    }
    .post-body .container {
      width: min(820px, 93%);
      margin: 0 auto;
    }
    .post-content {
      font-size: 16px;
      line-height: 1.8;
      color: #333;
    }
    .post-content h2 { font-size: 26px; font-weight: 600; margin: 32px 0 14px; color: var(--ink); }
    .post-content h3 { font-size: 20px; font-weight: 600; margin: 24px 0 12px; color: var(--ink); }
    .post-content p { margin-bottom: 18px; }
    .post-content ul, .post-content ol { margin: 0 0 18px 22px; }
    .post-content li { margin-bottom: 6px; }
    .post-content a { color: var(--wine-dark); text-decoration: underline; }
    .post-content img { max-width: 100%; height: auto; border-radius: 8px; margin: 18px 0; }
    .post-content blockquote {
      border-left: 3px solid var(--wine);
      padding: 8px 18px;
      margin: 18px 0;
      color: var(--muted);
      font-style: italic;
    }
    .post-content code {
      background: #f4f4f4;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 0.9em;
    }

    .post-tags {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .post-tag {
      background: var(--bg);
      color: var(--ink);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
    }

    .post-gallery {
      margin: 30px 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }
    .post-gallery img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 6px;
    }

    .share-row {
      margin-top: 32px;
      padding: 18px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      display: flex;
      gap: 12px;
      align-items: center;
      font-size: 13px;
      color: var(--muted);
    }
    .share-row a {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--wine-dark);
      font-weight: 500;
    }

    .loading, .error {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    footer.site-footer {
      background: var(--bg);
      padding: 24px 0;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }
    footer.site-footer a { color: var(--wine-dark); font-weight: 500; }

    @media (max-width: 600px) {
      .post-title { font-size: 28px; }
      .post-hero { padding: 32px 0 24px; }
      .post-body { padding: 30px 0 50px; }
      .menu a { padding: 7px 12px; font-size: 10px; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="container">
      <nav class="menu" aria-label="Menu principal">
        <a href="/#home">HOME</a>
        <a href="/#quem-somos">QUEM SOMOS</a>
        <a href="/#areas">ÁREAS DE ATUAÇÃO</a>
        <a href="/#sobre-mim">SOBRE MIM</a>
        <a href="/#redes">REDES SOCIAIS</a>
        <a href="/#contato">CONTATO</a>
        <a href="/blog.html">BLOG</a>
      </nav>
    </div>
  </header>

  <main id="post-main">
    <p class="loading">Carregando post...</p>
  </main>

  <footer class="site-footer">
    <div class="container">
      © <span id="year"></span> Nilma Alves Advocacia
      &nbsp;·&nbsp;
      by <a href="https://kbosolucoes.com.br" target="_blank" rel="noreferrer noopener">KBO Soluções</a>
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatDate(iso) {
      if (!iso) return '';
      try {
        return new Date(iso).toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });
      } catch { return ''; }
    }

    function getSlug() {
      const params = new URLSearchParams(window.location.search);
      return params.get('slug');
    }

    async function loadPost() {
      const slug = getSlug();
      const main = document.getElementById('post-main');
      if (!slug) {
        main.innerHTML = '<p class="error">Post não especificado. <a href="/blog.html">Voltar ao blog</a>.</p>';
        return;
      }
      try {
        const res = await fetch(`/api/public/posts/${encodeURIComponent(slug)}`);
        if (res.status === 404) {
          main.innerHTML = '<p class="error">Post não encontrado. <a href="/blog.html">Voltar ao blog</a>.</p>';
          return;
        }
        if (!res.ok) {
          main.innerHTML = '<p class="error">Erro ao carregar o post. Tente novamente mais tarde.</p>';
          return;
        }
        const post = await res.json();
        document.title = `${post.title} | Dra. Nilma Alves`;

        const cleanHtml = window.DOMPurify ? DOMPurify.sanitize(post.contentHtml || '') : post.contentHtml;
        const coverStyle = post.coverImage ? `style="background-image:url('${escapeHtml(post.coverImage)}')"` : '';
        const tags = (post.tags || []).map((t) => `<span class="post-tag">${escapeHtml(t)}</span>`).join('');
        const gallery = (post.images && post.images.length)
          ? `<div class="post-gallery">${post.images.map((img) => `<img src="${escapeHtml(img.url)}" alt="${escapeHtml(img.alt || '')}">`).join('')}</div>`
          : '';
        const shareUrl = encodeURIComponent(window.location.href);
        const shareText = encodeURIComponent(post.title);

        main.innerHTML = `
          <section class="post-hero">
            <div class="container">
              <a class="post-back" href="/blog.html">← Voltar ao blog</a>
              <h1 class="post-title">${escapeHtml(post.title)}</h1>
              <div class="post-meta">
                <span><strong>${escapeHtml(post.author || 'Dra. Nilma Alves')}</strong></span>
                <span>${escapeHtml(formatDate(post.publishedAt))}</span>
              </div>
            </div>
          </section>
          ${post.coverImage ? `<div class="post-cover" ${coverStyle}></div>` : ''}
          <section class="post-body">
            <div class="container">
              <div class="post-content">${cleanHtml}</div>
              ${gallery}
              ${tags ? `<div class="post-tags">${tags}</div>` : ''}
              <div class="share-row">
                <span>Compartilhar:</span>
                <a href="https://api.whatsapp.com/send?text=${shareText}%20${shareUrl}" target="_blank" rel="noopener noreferrer">WhatsApp</a>
                <a href="https://www.facebook.com/sharer/sharer.php?u=${shareUrl}" target="_blank" rel="noopener noreferrer">Facebook</a>
                <a href="https://www.linkedin.com/sharing/share-offsite/?url=${shareUrl}" target="_blank" rel="noopener noreferrer">LinkedIn</a>
              </div>
            </div>
          </section>
        `;
      } catch (err) {
        main.innerHTML = '<p class="error">Erro de conexão. Tente novamente mais tarde.</p>';
      }
    }

    loadPost();
  </script>
</body>
</html>
